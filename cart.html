<!DOCTYPE html>
<html lang="en">

<head>

  <!-- Google Tag Manager -->
  <script>
  (function(w,d,s,l,i){
    w[l]=w[l]||[];
    w[l].push({'gtm.start':
    new Date().getTime(),event:'gtm.js'});
    var f=d.getElementsByTagName(s)[0],
    j=d.createElement(s),
    dl=l!='dataLayer'?'&l='+l:'';
    j.async=true;
    j.src='https://www.googletagmanager.com/gtm.js?id='+i+dl;
    f.parentNode.insertBefore(j,f);
  })(window,document,'script','dataLayer','GTM-K2QGFTBD');
  </script>
  <!-- End Google Tag Manager -->

  <meta charset="UTF-8">
  <title>Cart</title>

</head>

<body>

  <!-- Google Tag Manager (noscript) -->
  <noscript>
    <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-K2QGFTBD"
    height="0" width="0" style="display:none;visibility:hidden"></iframe>
  </noscript>

  <h1>Your Cart</h1>

  <div id="cart-container"></div>

  <h3 id="cart-total"></h3>

  <button onclick="goToCheckout()">
    Proceed to Checkout
  </button>

  <br><br>

  <a href="products.html">Continue Shopping</a>

  <nav>
    <a href="index.html">Home</a> |
    <a href="products.html">View Products</a> |
    <a href="product-detail.html">Product Detail</a> |
    <a href="cart.html">Cart</a> |
    <a href="checkout.html">Checkout</a> |
    <a href="about.html">About</a>
    <a href="login.html" class="nav-link login-link">Login</a>
  </nav>

  <hr>

<script>

window.dataLayer = window.dataLayer || [];

// GET CART FROM LOCAL STORAGE
const cartItems =
  JSON.parse(localStorage.getItem("cart")) || [];

// CART UI CONTAINER
const cartContainer =
  document.getElementById("cart-container");

let totalAmount = 0;

// EMPTY CART
if (cartItems.length === 0) {

  cartContainer.innerHTML =
    "<p>Your cart is empty.</p>";

} else {

  // RENDER CART ITEMS
  cartItems.forEach(function(item) {

    totalAmount += item.price * item.quantity;

    const itemHTML = `
      <div>
        <h3>${item.item_name}</h3>
        <p>Category: ${item.item_category}</p>
        <p>Price: $${item.price}</p>
        <p>Quantity: ${item.quantity}</p>
        <hr>
      </div>
    `;

    cartContainer.innerHTML += itemHTML;

  });

  // TOTAL
  document.getElementById("cart-total").innerText =
    "Total: $" + totalAmount;

  // VIEW CART EVENT
  dataLayer.push({
    event: "view_cart",
    ecommerce: {
      currency: "USD",
      value: totalAmount,
      items: cartItems
    }
  });

}

// CHECKOUT NAVIGATION
function goToCheckout() {

  dataLayer.push({
    event: "begin_checkout",
    ecommerce: {
      currency: "USD",
      value: totalAmount,
      items: cartItems
    }
  });

  setTimeout(function() {

    window.location.href =
      "checkout.html?order_id=ORD123&status=success";

  }, 300);

}

</script>

</body>
</html>
