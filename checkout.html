<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout</title>

<!-- Google Tag Manager -->
<script>
(function(w,d,s,l,i){
  w[l]=w[l]||[];
  w[l].push({'gtm.start': new Date().getTime(), event:'gtm.js'});
  var f=d.getElementsByTagName(s)[0],
      j=d.createElement(s),
      dl=l!='dataLayer'?'&l='+l:'';
  j.async=true;
  j.src='https://www.googletagmanager.com/gtm.js?id='+i+dl;
  f.parentNode.insertBefore(j,f);
})(window,document,'script','dataLayer','GTM-K2QGFTBD');
</script>
<!-- End GTM -->

<style>
body { font-family: Arial; padding: 20px; }
.product-box { border: 1px solid #ccc; padding: 15px; margin-bottom: 15px; }
button { padding: 10px 16px; cursor: pointer; margin-right: 10px; }
nav { margin-top: 20px; }
#paymentLink { display:inline-block; margin: 15px 0; padding:10px 14px; background:#000; color:#fff; text-decoration:none; }
</style>

</head>

<body>

<!-- GTM noscript -->
<noscript>
<iframe src="https://www.googletagmanager.com/ns.html?id=GTM-K2QGFTBD"
height="0" width="0" style="display:none;visibility:hidden"></iframe>
</noscript>

<h1>Checkout</h1>

<div id="checkout-container"></div>
<h2 id="checkout-total"></h2>

<!-- PAYMENT LINK -->
<a id="paymentLink" href="#">Proceed to Payment</a>

<button onclick="clearCart()">Clear Cart</button>
<button onclick="logoutUser()">Logout</button>

<nav>
<a href="index.html">Home</a> |
<a href="products.html">Products</a> |
<a href="cart.html">Cart</a> |
<a href="checkout.html">Checkout</a> |
<a href="login.html">Login</a>
</nav>

<script>

window.dataLayer = window.dataLayer || [];

const cartItems = JSON.parse(localStorage.getItem("cart")) || [];

const checkoutContainer = document.getElementById("checkout-container");
const checkoutTotal = document.getElementById("checkout-total");
const paymentLink = document.getElementById("paymentLink");

let totalAmount = 0;

// LOGIN CHECK
function isLoggedIn() {
  return localStorage.getItem('user_id');
}

// RENDER CART
if (cartItems.length === 0) {
  checkoutContainer.innerHTML = "<p>Your cart is empty.</p>";
} else {

  cartItems.forEach(item => {
    totalAmount += item.price * item.quantity;

    checkoutContainer.innerHTML += `
      <div class="product-box">
        <h3>${item.item_name}</h3>
        <p>${item.item_category}</p>
        <p>$${item.price}</p>
        <p>Qty: ${item.quantity}</p>
      </div>
    `;
  });

  checkoutTotal.innerText = "Total: $" + totalAmount;

  dataLayer.push({
    event: "begin_checkout",
    ecommerce: {
      currency: "USD",
      value: totalAmount,
      items: cartItems
    }
  });
}

// BUILD PAYMENT URL (IMPORTANT PART)
const orderId = 'ORD' + Date.now();

const paymentUrl =
  'https://mywebsitepayment.netlify.app/payment.html'
  + '?order_id=' + orderId
  + '&amount=' + totalAmount;

// SET HREF (THIS IS WHAT ENABLES _gl)
paymentLink.href = paymentUrl;

// OPTIONAL: click tracking hook
paymentLink.addEventListener("click", function () {
  console.log("Redirecting to payment...");
});

// CLEAR CART
function clearCart() {
  localStorage.removeItem("cart");

  dataLayer.push({
    event: "remove_from_cart"
  });

  checkoutContainer.innerHTML = "";
  checkoutTotal.innerText = "0";
}

// LOGOUT
function logoutUser() {
  localStorage.removeItem('user_id');
  window.location.href = "login.html";
}

</script>

</body>
</html>
