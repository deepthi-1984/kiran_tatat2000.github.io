  <title>Checkout</title>

    w[l].push({

      event:'gtm.js'

        j = d.createElement(s),
        dl = l != 'dataLayer' ? '&l=' + l : '';

    j.async = true;
    j.src =
      'https://www.googletagmanager.com/gtm.js?id=' + i + dl;

    f.parentNode.insertBefore(j,f);

  })(window,document,'script','dataLayer','GTM-K2QGFTBD');
  </script>

<body>

<!-- Google Tag Manager (noscript) -->
<noscript>
  <iframe
    src="https://www.googletagmanager.com/ns.html?id=GTM-K2QGFTBD"
    height="0"
    width="0"
    style="display:none;visibility:hidden">
  </iframe>
</noscript>
<!-- End Google Tag Manager (noscript) -->

<h1>Checkout</h1>

<div id="checkout-container"></div>

<h2 id="checkout-total"></h2>

<button onclick="proceedToPayment()">
  Proceed to Payment
</button>

<button onclick="clearCart()">
  Clear Cart
</button>

<button onclick="logoutUser()">
  Logout
</button>

<nav>

  <a href="index.html">Home</a> |
  <a href="products.html">Products</a> |
  <a href="product-detail.html">Product Detail</a> |
  <a href="cart.html">Cart</a> |
  <a href="checkout.html">Checkout</a> |
  <a href="about.html">About</a> |
  <a href="login.html">Login</a>

</nav>

<hr>

<script>

window.dataLayer = window.dataLayer || [];

// GET CART
const cartItems =
  JSON.parse(localStorage.getItem("cart")) || [];

// DOM ELEMENTS
const checkoutContainer =
  document.getElementById("checkout-container");

const checkoutTotal =
  document.getElementById("checkout-total");

let totalAmount = 0;

// LOGIN CHECK
function isLoggedIn() {

  const user =
    localStorage.getItem('user_id');

  return user !== null && user !== '';
}

// RENDER EMPTY CART
if (cartItems.length === 0) {

  checkoutContainer.innerHTML =
    "<p>Your cart is empty.</p>";

} else {

  // RENDER PRODUCTS
  cartItems.forEach(function(item) {

    totalAmount +=
      item.price * item.quantity;

    checkoutContainer.innerHTML += `

      <div class="product-box">

        <h3>${item.item_name}</h3>

        <p>
          Category:
          ${item.item_category}
        </p>

        <p>
          Price:
          $${item.price}
        </p>

        <p>
          Quantity:
          ${item.quantity}
        </p>

      </div>

    `;
  });

  // SHOW TOTAL
  checkoutTotal.innerText =
    "Total Amount: $" + totalAmount;

  // BEGIN CHECKOUT EVENT
  dataLayer.push({

    event: "begin_checkout",

    ecommerce: {

      currency: "USD",

      value: totalAmount,

      items: cartItems.map(item => ({

        item_id:
          item.item_id || item.item_name,

        item_name:
          item.item_name,

        item_category:
          item.item_category,

        price:
          item.price,

        quantity:
          item.quantity

      }))
    }
  });

  console.log("begin_checkout fired");
}

// PROCEED TO PAYMENT
function proceedToPayment() {

  // CHECK LOGIN
  if (!isLoggedIn()) {

    // SAVE REDIRECT PAGE
    localStorage.setItem(
      'redirect_after_login',
      'https://mywebsitepayment.netlify.app/payment.html'
    );

    // REDIRECT TO LOGIN
    window.location.href =
      'login.html';

    return;
  }

// CREATE DYNAMIC ORDER ID
  const orderId =
    'ORD' + Date.now();

  // SEND DYNAMIC AMOUNT
  window.location.href =
    'https://mywebsitepayment.netlify.app/payment.html' +
    '?order_id=' + orderId +
    '&amount=' + totalAmount;
}

// CLEAR CART
function clearCart() {

  localStorage.removeItem("cart");

  dataLayer.push({
  event: "remove_from_cart",
  ecommerce: {
    items: cartItems
  }
});

  document.getElementById("checkoutContainer").innerHTML = "";
  document.getElementById("checkoutTotal").innerText = "0";

  alert("Cart cleared successfully");
}

// LOGOUT
function logoutUser() {

  localStorage.removeItem('user_id');

  localStorage.setItem('redirect_after_login', 'https://mywebsitepayment.netlify.app/payment.html');

  alert('Logged out successfully');

  window.location.href =
    'login.html';
}

</script>

</body>
</html>
