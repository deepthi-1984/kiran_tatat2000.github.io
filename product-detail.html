<html lang="en">
<head>

    dl=l!='dataLayer'?'&l='+l:'';

<body>

  <!-- Google Tag Manager (noscript) -->
  <noscript>
    <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-K2QGFTBD"
    height="0" width="0" style="display:none;visibility:hidden"></iframe>

  <h1>Product Detail</h1>

  <p id="product-name"></p>
  <p id="product-price"></p>

  <button id="add-to-cart">Add to Cart</button>

  <br><br>

  <a href="cart.html">Go to Cart</a>

  <nav>
    <a href="index.html">Home</a> |
    <a href="products.html">View Products</a> |
    <a href="product-detail.html">Product Detail</a> |
    <a href="cart.html">Cart</a> |
    <a href="checkout.html">Checkout</a> |
    <a href="about.html">About</a>
  </nav>

  <hr>

<script>

window.dataLayer = window.dataLayer || [];

// PRODUCT DATABASE
const products = {
  101: {
    item_name: "MacBook Pro 16",
    price: 2499,
    category: "Laptops"
  },
 102: {
    item_name: "Sony WH-1000XM5",
    price: 399,
    category: "Headphones"
  },
  103: {
    item_name: "Apple Watch Ultra",
    price: 799,
    category: "Smartwatches"
  }

 
};

// GET PRODUCT ID
function getProductId() {
  const params = new URLSearchParams(window.location.search);
  return params.get("product_id");
}

const productId = getProductId();
const product = products[productId];

// SAFE CHECK
if (!product) {

  document.body.innerHTML = `
    <h1>Product Not Found</h1>
    <a href="products.html">Go back</a>
  `;

} else {

  // RENDER UI
  document.getElementById("product-name").innerText =
    product.item_name;

  document.getElementById("product-price").innerText =
    "$" + product.price;

  // VIEW ITEM
  dataLayer.push({
    event: "view_item",
    ecommerce: {
      currency: "USD",
      value: product.price,
      items: [{
        item_id: productId,
        item_name: product.item_name,
        item_category: product.category,
        price: product.price
      }]
    }
  });

  // ADD TO CART
  document.getElementById("add-to-cart")
    .addEventListener("click", function () {

      let cart =
        JSON.parse(localStorage.getItem("cart")) || [];

      const existingItem = cart.find(function(item) {
        return item.item_id === productId;
      });

      if (existingItem) {
        existingItem.quantity += 1;
      } else {
        cart.push({
          item_id: productId,
          item_name: product.item_name,
          item_category: product.category,
          price: product.price,
          quantity: 1
        });
      }

      localStorage.setItem("cart", JSON.stringify(cart));

      dataLayer.push({
        event: "add_to_cart",
        ecommerce: {
          currency: "USD",
          value: product.price,
          items: [{
            item_id: productId,
            item_name: product.item_name,
            item_category: product.category,
            price: product.price
          }]
        }
      });

    });

}

</script>

</body>
</html>
